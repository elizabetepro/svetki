<div class="block">

</div>

<p>
Dzimšanas dienas mūsu ģimenē tiek svinētas ar kūku, svecēm un dāvanām.
Mēs dziedam dziesmas, spēlējam spēles un pavadām laiku kopā.
Tradicionāli galdā ir kūka, salāti un uzkodas, kā arī skan priecīga mūzika.
</p>
